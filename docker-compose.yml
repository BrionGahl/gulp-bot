services:
  gulp-bot:
    # IMAGE_TAG picks which loaded version runs; set it to an older tag to roll back.
    image: localhost/gulp-bot:${IMAGE_TAG:-latest}
    container_name: gulp-bot
    restart: unless-stopped
    pull_policy: never
    environment:
      # required
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      # optional
      # BOT_NAME and LOG_LEVEL need a non-empty fallback: the bot does not treat an empty value
      # as unset for these two.
      BOT_NAME: ${BOT_NAME:-gulp-bot}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # AI assistant (`/ask` and "Bot please"); without a key it stays off. Empty means "use the default".
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-}
      ANTHROPIC_DAILY_LIMIT: ${ANTHROPIC_DAILY_LIMIT:-}
      # A model on your own GPU instead of Claude: AI_BACKEND=local and an Ollama server (see the
      # README, "Running the model locally"). Empty means "use the default".
      AI_BACKEND: ${AI_BACKEND:-}
      LOCAL_MODEL_URL: ${LOCAL_MODEL_URL:-}
      LOCAL_MODEL: ${LOCAL_MODEL:-}
      LOCAL_MODEL_THINK: ${LOCAL_MODEL_THINK:-}
      # The AI assistant's guild prompt; empty means the one in the image (prompts/system_prompt.md).
      SYSTEM_PROMPT_PATH: ${SYSTEM_PROMPT_PATH:-}
      # database; `db` is the service name below, reachable on the stack's private network
      DATABASE_URL: postgres://gulp:${POSTGRES_PASSWORD}@db:5432/gulp
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:17
    container_name: gulp-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gulp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gulp
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gulp -d gulp"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
