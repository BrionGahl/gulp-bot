services:
  gulp-bot:
    # IMAGE_TAG picks which loaded version runs; set it to an older tag to roll back.
    image: localhost/gulp-bot:${IMAGE_TAG:-latest}
    container_name: gulp-bot
    restart: unless-stopped
    pull_policy: never
    environment:
      # required
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      # optional
      # BOT_NAME and LOG_LEVEL need a non-empty fallback: the bot does not treat an empty value
      # as unset for these two.
      BOT_NAME: ${BOT_NAME:-gulp-bot}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The AI assistant (`/ask`, "Bot please", "hey bot"). It answers with a model on your own hardware,
      # through the Ollama server at LOCAL_MODEL_URL, so nothing members write leaves your machines;
      # docker-compose.ollama.yml runs that server next to the bot (see the README, "Running the model").
      # Each value below is the default when it isn't set in .env.
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-100}
      LOCAL_MODEL_URL: ${LOCAL_MODEL_URL:-http://ollama:11434}
      LOCAL_MODEL: ${LOCAL_MODEL:-qwen3.5:9b}
      LOCAL_MODEL_THINK: ${LOCAL_MODEL_THINK:-false}
      # What the assistant knows about the guild: the file in the image, unless you mount your own.
      SYSTEM_PROMPT_PATH: ${SYSTEM_PROMPT_PATH:-/app/ext_resources/system_prompt.md}
      # database; `db` is the service name below, reachable on the stack's private network
      DATABASE_URL: postgres://gulp:${POSTGRES_PASSWORD}@db:5432/gulp
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:17
    container_name: gulp-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gulp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gulp
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gulp -d gulp"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
