name: Build and Deploy

on:
  push:
    branches: [master]

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/gulp-bot/gulp-bot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: gulp-bot
          image: ${{ env.IMAGE }}:${{ github.sha }}
          region: ${{ vars.GCP_REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          # The bot has nothing to serve, only a Discord gateway connection to keep alive, so:
          # - min/max instances pinned to 1 (no scale-to-zero, no duplicate gateway sessions)
          # - CPU throttling disabled (the container must run background work between requests)
          # - unauthenticated invocation disabled (nothing external needs to call this service)
          flags: --min-instances=1 --max-instances=1 --no-cpu-throttling --no-allow-unauthenticated
          env_vars: |
            BOT_NAME=${{ vars.BOT_NAME }}
            MOD_ROLE_ID=${{ vars.MOD_ROLE_ID }}
            RAIDER_ROLE_ID=${{ vars.RAIDER_ROLE_ID }}
            CLIPS_CHANNEL_IDS=${{ vars.CLIPS_CHANNEL_IDS }}
            LOG_LEVEL=${{ vars.LOG_LEVEL }}
            DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
            BART_TOKEN=${{ secrets.BART_TOKEN }}
