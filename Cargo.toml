[package]
name = "gulp-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.21.2", features = ["macros", "rt-multi-thread", "net", "io-util"] }
log = "0.4.29"
tracing-subscriber = "0.3.22"
tracing-stackdriver = "0.10"
poise = "0.6.1"
reqwest = { version = "0.12.26", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
rand = "0.9.2"